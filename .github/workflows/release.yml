name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: build-run (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cuda12.9-ubuntu22.04
            dockerfile: docker/Dockerfile.cuda12.9.ubuntu22.04
            runs-on: ubuntu-22.04
            platform: linux/amd64
          - name: cuda13-ubuntu22.04
            dockerfile: docker/Dockerfile.cuda13.x.ubuntu22.04
            runs-on: ubuntu-22.04
            platform: linux/amd64
          - name: cuda12.x-rockylinux8
            dockerfile: docker/Dockerfile.cuda12.x.rockylinux8
            runs-on: ubuntu-22.04
            platform: linux/amd64
          - name: cuda13-ubuntu22.04-nccl2.30-arm64
            dockerfile: docker/Dockerfile.cuda13.x.ubuntu22.04.nccl2.30.arm64
            runs-on: ubuntu-22.04-arm      # native arm64 runner (do NOT use amd64 + QEMU)
            platform: linux/arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.name }}-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h

      - name: Build run package
        run: |
          BUILD_DATE=$(date +%Y%m%d)

          docker buildx build \
            --platform ${{ matrix.platform }} \
            --progress=plain \
            -f ${{ matrix.dockerfile }} \
            --build-arg BUILD_DATE=${BUILD_DATE} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --output type=local,dest=dist/${{ matrix.name }} \
            .

          # rotate cache (avoid unbounded growth)
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          echo "Produced files:"
          ls -lh dist/${{ matrix.name }}

      - name: Upload run to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.name }}/*.run
